# RisingOS: preferir IPv4 sobre IPv6 cuando ambos estén disponibles.
# Causa: docker pull contra ghcr.io fallaba con "connection reset by peer"
# en IPv6 en ciertas redes/ISP, generando reintentos en loop. IPv4 funciona
# normalmente en los mismos casos. No deshabilita IPv6 a nivel sistema,
# solo ajusta el orden de preferencia de getaddrinfo() (RFC 6724).
# Recomendación oficial de glibc (ver comentario en archivo default):
# "For sites which prefer IPv4 connections change the last line to
#  precedence ::ffff:0:0/96 100"
precedence ::ffff:0:0/96 100
