# calamares.conf — Configuración principal de Calamares para RisingOS
# Rising Arrow / Francisco Galaso

brandingComponentName: risingos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false

# Secuencia de módulos
sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - bootloader-config
    - grubcfg
    - bootloader
    - shellprocess-grub
    - swapfile
    - removeuser
    - umount
  - show:
    - finished

# Módulos a cargar
modules-search: [ local, /usr/lib/calamares/modules ]
