# users.conf
defaultGroups:
  - name: sudo
    must_exist: false
    state: true
  - name: audio
    must_exist: false
    state: true
  - name: video
    must_exist: false
    state: true
  - name: plugdev
    must_exist: false
    state: true
  - name: netdev
    must_exist: false
    state: true
  - name: bluetooth
    must_exist: false
    state: true

autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 6
userShell: /bin/bash
avatarFilePath: "/usr/share/pixmaps/risingos-avatar.png"
