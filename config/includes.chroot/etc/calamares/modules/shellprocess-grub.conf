# calamares/modules/shellprocess-grub.conf
# Copia el tema GRUB de RisingOS al sistema instalado y regenera GRUB
# Referenciado en settings.conf dentro de la secuencia exec:

# Directorio raíz del sistema instalado (Calamares lo expone como variable)
# Se usa ${ROOT} que Calamares expande al mountpoint real

dontChroot: false

script:
  # 1. Crear directorio de temas GRUB en el sistema instalado
  - "-": "mkdir -p /boot/grub/themes/risingos"

  # 2. Copiar tema desde /usr/share/grub/themes/risingos
  #    (instalado por el paquete risingos-grub-theme o copiado por hook)
  - "-": "cp -r /usr/share/grub/themes/risingos/. /boot/grub/themes/risingos/"

  # 3. Asegurar que GRUB_THEME apunte al tema correcto
  - "-": >
      sed -i
      's|^#\?GRUB_THEME=.*|GRUB_THEME="/boot/grub/themes/risingos/theme.txt"|'
      /etc/default/grub

  # 4. Agregar si no existe la línea
  - "-": >
      grep -q '^GRUB_THEME=' /etc/default/grub ||
      echo 'GRUB_THEME="/boot/grub/themes/risingos/theme.txt"' >> /etc/default/grub

  # 5. Regenerar GRUB
  - "-": "update-grub"
